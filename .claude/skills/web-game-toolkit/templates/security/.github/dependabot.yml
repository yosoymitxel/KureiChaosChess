version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Solo si hay package.json:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # Lo que index.html carga por CDN con versión fija se sube a mano (ver SKILL.md, Seguridad).
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
