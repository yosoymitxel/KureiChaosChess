<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><title>Barquito de papel, desde arriba</title>
<desc>Casco de papel con proa en punta y una vela de origami grande en el centro: cara al sol blanca y cara en sombra gris, con contorno grueso para leerse a pocos píxeles.</desc>
