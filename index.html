<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2a2118" />
  <title>Zugzwang</title>
  <meta name="description" content="Ajedrez mutante en formato roguelike de mesa: tableros con agujeros, piezas nuevas, mutaciones y jefes de varias casillas." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Zugzwang" />
  <meta property="og:description" content="Ajedrez mutante en formato roguelike de mesa: tableros con agujeros, piezas nuevas, mutaciones y jefes de varias casillas." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/board.css" />
  <link rel="stylesheet" href="css/screens.css" />
  <link rel="stylesheet" href="css/pixel.css" />
  <!-- Dependencies come from the CDN through an import map: no bundler, no build step.
       Pin exact versions; bump them deliberately. -->
  <script type="importmap">
  {
    "imports": {
      "preact": "https://cdn.jsdelivr.net/npm/preact@10.29.8/dist/preact.module.js",
      "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.29.8/hooks/dist/hooks.module.js",
      "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js",
      "animejs": "https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.esm.min.js",
      "motion": "https://cdn.jsdelivr.net/npm/motion@12.43.0/+esm"
    }
  }
  </script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <!-- Filtro de modo píxel (css/pixel.css): toma un punto cada 4 px y lo agranda a un cuadro de
       4×4, así los dibujos vectoriales (el jardín Zen) quedan a la misma escala que el arte píxel. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="px-filter" x="0" y="0" width="1" height="1">
    <feFlood x="2" y="2" width="1" height="1"/><feComposite width="4" height="4"/><feTile result="dots"/>
    <feComposite in="SourceGraphic" in2="dots" operator="in"/><feMorphology operator="dilate" radius="2"/>
  </filter></svg>
  <div id="root"></div>
  <noscript>Zugzwang necesita JavaScript.</noscript>
</body>
</html>
