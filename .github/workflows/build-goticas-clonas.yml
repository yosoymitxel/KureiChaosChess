name: Build Góticas Clonas

on:
  push:
    branches:
      - feat/gothic-clones-pixelart
    paths:
      - 'art/temas/goticas-clonas/**'
      - 'art/temas/LEEME.md'
      - 'tools/pixel-art.mjs'
      - 'tools/check-registry.mjs'
      - '.github/workflows/build-goticas-clonas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gothic-clones-pixelart
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Renderizar sprites con Claude-PXL
        run: npx --yes github:crsolver/claude-pxl build art/temas/goticas-clonas/piezas.px.js --out out
      - name: Importar tema y generar registros
        run: node tools/pixel-art.mjs
      - name: Comprobar sintaxis y registro
        run: |
          node --check tools/pixel-art.mjs
          node --check src/data/pixel-themes.js
          node --check src/data/pixel-packs.js
          node tools/check-registry.mjs
          node tools/art-check.mjs
      - name: Capturas reales de la aplicación
        run: |
          npm install --no-save http-server playwright
          npx playwright install --with-deps chromium
          (npx http-server -p 8123 -s -c-1 . > /tmp/zug-server.log 2>&1 &)
          mkdir -p artifacts
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const [name, viewport] of [
            ['desktop', { width: 1440, height: 960 }],
            ['mobile', { width: 390, height: 844 }],
          ]) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:8123/', { waitUntil: 'networkidle' });
            await page.evaluate(() => localStorage.setItem('zugzwang.settings.v2', JSON.stringify({ theme: 'goticas-clonas' })));
            await page.reload({ waitUntil: 'networkidle' });
            if (await page.locator('html').getAttribute('data-pack') !== 'goticas-clonas') throw new Error('El tema Góticas Clonas no se aplicó en ' + name);
            await page.screenshot({ path: `artifacts/zug-${name}.png`, fullPage: true });
            await page.close();
          }
          await browser.close();
          JS
      - name: Guardar previsualizaciones y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gothic-clones-preview-and-screenshots
          path: |
            out/_preview/
            out/sprites/
            artifacts/
          if-no-files-found: warn
      - name: Guardar recursos generados en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixel/goticas-clonas src/data/pixel-packs.js src/data/pixel-themes.js
          if ! git diff --cached --quiet; then
            git commit -m "build(pixel-art): generate gothic clones assets"
            git push origin HEAD:feat/gothic-clones-pixelart
          fi
