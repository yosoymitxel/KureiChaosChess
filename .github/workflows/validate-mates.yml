name: Validate mate puzzles

on:
  push:
    branches: [fix/true-mate-validator]
  pull_request:
    paths:
      - 'src/game/mates.js'
      - 'src/data/mates.js'
      - 'tools/mates-gen.mjs'
      - 'tools/mates-validate.mjs'
      - '.github/workflows/validate-mates.yml'

jobs:
  validate-mates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate 20 mate-in-two positions
        run: |
          node tools/mates-gen.mjs > /tmp/mates.js
          cp /tmp/mates.js src/data/mates.js
      - name: Validate every stored position
        run: node tools/mates-validate.mjs
      - name: Print generated puzzle data
        run: cat src/data/mates.js
