name: Validate mate puzzles

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/game/mates.js'
      - 'src/data/mates.js'
      - 'tools/mates-validate.mjs'
      - '.github/workflows/validate-mates.yml'

jobs:
  validate-mates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every stored position
        run: node tools/mates-validate.mjs
