name: Validate game rules and APK lab

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/game/backup.js'
      - 'src/cloud/**'
      - 'src/ui/screens/setup.js'
      - 'src/ui/screens/cloud-account.js'
      - 'index.html'
      - 'tools/cloud-save-selfcheck.mjs'
      - 'tools/build-itch.mjs'
      - 'docs/ITCH.md'
      - 'PRODUCT.md'
      - 'README.md'
      - 'package.json'
      - 'src/game/mates.js'
      - 'src/data/mates.js'
      - 'tools/mates-validate.mjs'
      - 'tools/apk-vfx-check.mjs'
      - 'src/lab.js'
      - 'src/lab/apk/**'
      - 'lab.html'
      - 'tests/apk-lab.html'
      - 'css/screens.css'
      - 'references/apk/**'
      - 'docs/APK-MINIGAMES-MAP.md'
      - '.github/workflows/validate-mates.yml'

jobs:
  validate-mates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Parse lab and APK modules
        run: |
          node --input-type=module --check < src/lab.js
          node --input-type=module --check < src/lab/apk/effects.js
          node --input-type=module --check < src/lab/apk/prototypes.js
          node --input-type=module --check < src/lab/apk/playable-match.js
          node --input-type=module --check < src/lab/apk/expansion.js
      - name: Guard APK VFX isolation
        run: node tools/apk-vfx-check.mjs
      - name: Validate playable APK match loop
        run: node tools/apk-match-selfcheck.mjs
      - name: Validate every stored position
        run: node tools/mates-validate.mjs
      - name: Parse cloud account modules
        run: |
          node --input-type=module --check < src/cloud/supabase.js
          node --input-type=module --check < src/cloud/cloud-save.js
          node --input-type=module --check < src/ui/screens/cloud-account.js
      - name: Validate cloud save snapshot format
        run: node tools/cloud-save-selfcheck.mjs
