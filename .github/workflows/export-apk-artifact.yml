name: Export APK artifact
on:
  push:
    branches: [Apk]
    paths:
      - 'muestra.apk'
      - '.github/workflows/export-apk-artifact.yml'
permissions:
  contents: read
jobs:
  export-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: muestra-apk
          path: muestra.apk
          if-no-files-found: error
          retention-days: 1
