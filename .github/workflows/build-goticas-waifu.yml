name: Build Góticas Waifu
on:
  push:
    branches:
      - feat/goticas-waifu-theme
    paths:
      - 'art/temas/goticas-waifu/**'
      - 'tools/pixel-art.mjs'
      - '.github/workflows/build-goticas-waifu.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/goticas-waifu-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Renderizar fuentes pixel art
        run: |
          for file in art/temas/*/*.px.js; do
            [ -f "$file" ] || continue
            npx --yes github:crsolver/claude-pxl build "$file"
          done
      - name: Generar recursos y registros
        run: node tools/pixel-art.mjs
      - name: Verificar salida
        run: |
          node --check src/data/pixel-themes.js
          node --check src/data/pixel-packs.js
          node tools/check-registry.mjs
          node tools/art-check.mjs
      - name: Guardar recursos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixel src/data/pixel-packs.js src/data/pixel-themes.js
          if ! git diff --cached --quiet; then
            git commit -m "build(pixel-art): generate goticas waifu assets"
            git push origin HEAD:feat/goticas-waifu-theme
          fi
