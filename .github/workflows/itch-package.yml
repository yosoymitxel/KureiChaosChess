name: itch.io package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build itch.io ZIP
        run: node tools/build-itch.mjs
      - name: Validate itch.io ZIP
        run: node tools/itch-package-selfcheck.mjs
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: kurei-chaos-chess-itch
          path: dist/kurei-chaos-chess-itch.zip
          if-no-files-found: error
          retention-days: 7
